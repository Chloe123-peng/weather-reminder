name: Weather Reminder

on:
  schedule:
    # 台灣時間 08:00 = UTC 00:00
    - cron: '0 0 * * *'
    # 台灣時間 13:35 = UTC 05:35
    - cron: '35 5 * * *'
  workflow_dispatch: {}   # 讓你可以手動點按鈕測試

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓天氣並發送通知
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          LOCATION_NAME: ${{ secrets.LOCATION_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python scripts/check_weather.py

      - name: 把 weather.json 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git commit -m "update weather.json" || echo "沒有變更可提交"
          git push
          